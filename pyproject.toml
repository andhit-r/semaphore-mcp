[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semaphore-mcp"
dynamic = ["version"]
description = "MCP server for the Semaphore UI REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andhitia Rama", email = "andhitia.r@gmail.com" }]
keywords = ["mcp", "semaphore", "ansible", "automation", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
semaphore-mcp = "semaphore_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/andhit-r/semaphore-mcp"
Repository = "https://github.com/andhit-r/semaphore-mcp"
Issues = "https://github.com/andhit-r/semaphore-mcp/issues"
Changelog = "https://github.com/andhit-r/semaphore-mcp/blob/main/CHANGELOG.md"

# Versi dibaca dari src/semaphore_mcp/__init__.py (sumber tunggal).
[tool.hatch.version]
path = "src/semaphore_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/semaphore_mcp"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
